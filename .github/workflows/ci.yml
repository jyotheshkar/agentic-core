name: CI

on:
  push:
  pull_request:

jobs:
  repository:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate repository
        run: python scripts/validate-repository.py
      - name: Validate imported shared core
        run: python -B core/validation/test_aios_skills.py
      - name: Run repository contract tests
        run: python -B -m unittest discover -s evals -p 'test_*.py'
      - name: Run product tests
        shell: bash
        run: |
          if [ -f products/job-searching-agent/site/package.json ]; then
            cd products/job-searching-agent/site
            npm ci
            npm run check
          fi
      - name: Reject private or generated files
        shell: pwsh
        run: ./scripts/check-secrets.ps1
