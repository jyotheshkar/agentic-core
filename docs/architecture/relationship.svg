    </g>
    <text style="font-size: 10px; font-family: 'DejaVu Sans'; text-anchor: middle" x="576" y="213.597656" transform="rotate(-0 576 213.597656)">design principles</text>
   </g>
   <g id="text_8">
    <text style="font-weight: 700; font-size: 13px; font-family: 'DejaVu Sans'; text-anchor: start" x="270.72" y="427.477969" transform="rotate(-0 270.72 427.477969)">Shared engineering principles</text>
   </g>
   <g id="text_9">
    <text style="font-size: 11px; font-family: 'DejaVu Sans'" transform="translate(270.72 463.445312)">Explicit permissions, stable state, evidence gates, checkpoints and truthful status</text>
    <text style="font-size: 11px; font-family: 'DejaVu Sans'" transform="translate(270.72 479.945312)">This connection does not establish shared runtime code or live software integration</text>
   </g>
   <g id="text_10">
    <text style="font-size: 10px; font-family: 'DejaVu Sans'; text-anchor: start" x="43.2" y="657.36" transform="rotate(-0 43.2 657.36)">Solid: evidenced implementation / recorded mechanism    Dashed: runtime or end-to-end verification incomplete    Dotted: proposed</text>
   </g>
   <g id="text_11">
    <text style="font-size: 10px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #444444" x="43.2" y="684" transform="rotate(-0 43.2 684)">Earlier MOA roles remain separate from the new coordinator. Specialist instructions are not independently running services.</text>
   </g>
  </g>
