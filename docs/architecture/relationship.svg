   <g id="text_1">
    <text style="font-weight: 700; font-size: 25px; font-family: 'DejaVu Sans'; text-anchor: start" x="43.2" y="43.2" transform="rotate(-0 43.2 43.2)">Agentic Core + SOL System | Related Contributions</text>
   </g>
   <g id="text_2">
    <text style="font-size: 12px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #444444" x="43.2" y="73.44" transform="rotate(-0 43.2 73.44)">Reusable workflow architecture and a concrete operational application remain distinct projects</text>
   </g>
   <g id="text_3">
    <text style="font-weight: 700; font-size: 13px; font-family: 'DejaVu Sans'; text-anchor: start" x="69.12" y="161.077969" transform="rotate(-0 69.12 161.077969)">Agentic Core: reusable builder</text>
   </g>
   <g id="text_4">
    <text style="font-size: 11px; font-family: 'DejaVu Sans'" transform="translate(69.12 197.045313)">Bounded requirements and capability selection</text>
    <text style="font-size: 11px; font-family: 'DejaVu Sans'" transform="translate(69.12 213.545313)">Versioned workflow packages and Guardian checks</text>
    <text style="font-size: 11px; font-family: 'DejaVu Sans'" transform="translate(69.12 230.045313)">Python compiler / engine, SQLite state and typed receipts</text>
    <text style="font-size: 11px; font-family: 'DejaVu Sans'" transform="translate(69.12 246.545313)">Execution and business acceptance are separate</text>
   </g>
   <g id="text_5">
    <text style="font-weight: 700; font-size: 13px; font-family: 'DejaVu Sans'; text-anchor: start" x="637.92" y="161.077969" transform="rotate(-0 637.92 161.077969)">SOL System: applied operations</text>
   </g>
   <g id="text_6">
    <text style="font-size: 11px; font-family: 'DejaVu Sans'" transform="translate(637.92 197.045313)">Scout routes qualified work to Auto OR Ultra</text>
    <text style="font-size: 11px; font-family: 'DejaVu Sans'" transform="translate(637.92 213.545313)">Candidate preparation, permitted outreach and recovery</text>
    <text style="font-size: 11px; font-family: 'DejaVu Sans'" transform="translate(637.92 230.045313)">Sheets ledger, Gmail / Outlook and protected Pulse</text>
    <text style="font-size: 11px; font-family: 'DejaVu Sans'" transform="translate(637.92 246.545313)">Human-controlled portal submission</text>
   </g>
   <g id="text_7">
    <g id="patch_8">
     <path d="M 531.653125 218 
